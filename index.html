<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-type" content="text/html; charset=UTF-8">
    <title>Google Pixel - Customer Registration</title>
    <style>
        /* Global Page Background Styling */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e4ebf5, #dbe3f0);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Clean Card Layout Container */
        .form-container {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
        }

        /* Heading Customizations */
        .form-container h2 {
            margin-top: 0;
            margin-bottom: 6px;
            color: #1a73e8;
            font-size: 24px;
            font-weight: 600;
        }

        .form-container p {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Form Layout Elements */
        label {
            display: block;
            margin-bottom: 6px;
            margin-top: 16px;
            color: #202124;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            color: #3c4043;
            background-color: #f8f9fa;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        /* Interactive Field Highlight Effects */
        input[type="text"]:focus, 
        select:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
            outline: none;
            background-color: #ffffff;
        }

        /* Submit Action Styling */
        input[type="submit"] {
            width: 100%;
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 28px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 2px 5px rgba(26, 115, 232, 0.25);
        }

        input[type="submit"]:hover {
            background-color: #1557b0;
        }

        input[type="submit"]:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Customer Registration</h2>
        <p>Please register your Google Pixel device information below.</p>
        
        <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Dg700000D0a4t" method="POST">
            
            <!-- Salesforce Tracking Identifiers -->
            <input type="hidden" name="oid" value="00Dg700000D0a4t">
            <input type="hidden" name="retURL" value="https://yugendrarepo.github.io/Gogle-pixel-repository/">

            <!-- Form Contact Input Fields -->
            <label for="first_name">First Name</label>
            <input id="first_name" maxlength="40" name="first_name" type="text" placeholder="John" required />

            <label for="last_name">Last Name</label>
            <input id="last_name" maxlength="80" name="last_name" type="text" placeholder="Doe" required />

            <label for="email">Email Address</label>
            <input id="email" maxlength="80" name="email" type="text" placeholder="name@example.com" required />

            <label for="company">Company</label>
            <input id="company" maxlength="40" name="company" type="text" placeholder="Organization name" />

            <label for="city">City</label>
            <input id="city" maxlength="40" name="city" type="text" placeholder="e.g. New York" />

            <!-- Country Selection Dropdown List -->
            <label for="country_code">Country</label>
            <select id="country_code" name="country_code">
                <option value="">--Select Country--</option>
                <option value="US">United States (US)</option>
                <option value="IN">India (IN)</option>
                <option value="GB">United Kingdom (GB)</option>
                <option value="CA">Canada (CA)</option>
                <option value="AU">Australia (AU)</option>
                <option value="DE">Germany (DE)</option>
                <option value="FR">France (FR)</option>
                <option value="JP">Japan (JP)</option>
            </select>

            <input type="submit" name="submit" value="Complete Registration">
        </form>
    </div>

</body>
</html>
