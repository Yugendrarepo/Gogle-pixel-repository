<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Interest | The New Google Phone</title>
    <style>
        :root {
            --google-blue: #1a73e8;
            --google-gray: #5f6368;
            --google-light: #f8f9fa;
            --text-dark: #202124;
            --border-color: #dadce0;
        }
        body {
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            background-color: var(--google-light);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 0 0 8px 0;
            color: var(--text-dark);
        }
        .header p {
            font-size: 14px;
            color: var(--google-gray);
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--google-gray);
        }
        input[type="text"], input[type="email"], select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: #fff;
            color: var(--text-dark);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus, input[type="email"]:focus, select:focus {
            border-color: var(--google-blue);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
            outline: none;
        }
        .submit-btn {
            width: 100%;
            background-color: var(--google-blue);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #1557b0;
        }
        .footer-text {
            font-size: 12px;
            color: var(--google-gray);
            text-align: center;
            margin-top: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Google Hardware Launch</h1>
        <p>Register below to receive exclusive device priority details</p>
    </div>

    <form action="https://salesforce.com" method="POST" id="leadForm">

        <!-- Hidden System Requirements (Securely Linked) -->
        <input type="hidden" name="oid" value="00Dg700000D0a4t">
        <input type="hidden" name="retURL" value="https://google.com">
        <input type="hidden" name="lead_source" value="Web">
        
        <!-- Hidden Territory Assignment Parameter -->
        <input type="hidden" id="custom_region_field" name="Region__c" value="Other_region">

        <div class="form-group">
            <label for="first_name">First Name</label>
            <input id="first_name" maxlength="40" name="first_name" type="text" placeholder="John" required />
        </div>

        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input id="last_name" maxlength="80" name="last_name" type="text" placeholder="Doe" required />
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input id="email" maxlength="80" name="email" type="email" placeholder="name@company.com" required />
        </div>

        <div class="form-group">
            <label for="company">Company</label>
            <input id="company" maxlength="40" name="company" type="text" placeholder="Mallow Tech" required />
        </div>

        <div class="form-group">
            <label for="city">City</label>
            <input id="city" maxlength="40" name="city" type="text" placeholder="Karur" required />
        </div>

        <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country" required>
                <option value="">Select country...</option>
                <option value="US">United States</option>
                <option value="CA">Canada</option>
                <option value="MX">Mexico</option>
                <option value="IN">India</option>
                <option value="JP">Japan</option>
                <option value="FR">France</option>
                <option value="GB">United Kingdom</option>
                <option value="BR">Brazil</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">Submit Registration</button>
    </form>

    <div class="footer-text">
        Secure transmission link authorized by Salesforce Web-to-Lead Endpoint APIs.
    </div>
</div>

<script>
    // System Territory Mapping Engine
    document.getElementById('leadForm').addEventListener('submit', function() {
        const countrySelect = document.getElementById('country');
        const selectedISO = countrySelect.value;
        const regionHiddenInput = document.getElementById('custom_region_field');

        const codeMapping = {
            'US': 'North_America', 'CA': 'North_America', 'MX': 'North_America',
            'IN': 'APAC', 'JP': 'APAC',
            'FR': 'EMEA', 'GB': 'EMEA',
            'BR': 'LATAM'
        };

        if (codeMapping[selectedISO]) {
            regionHiddenInput.value = codeMapping[selectedISO];
        } else {
            regionHiddenInput.value = 'Other_region';
        }
    });
</script>

</body>
</html>
